name: Deploy Tablekeep to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site and resolve manifest URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.json icon.svg _site/
          cp -R assets data _site/
          touch _site/.nojekyll

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="https://${OWNER}.github.io/${REPO}"
          sed "s#https://YOUR-USERNAME.github.io/YOUR-REPO#${BASE}#g" manifest.json > _site/manifest.json

          test -s _site/index.html
          test -s _site/manifest.json
          test -s _site/assets/app.js
          test -s _site/assets/app.css
          test -s _site/data/2014/classes.json
          test -s _site/data/2024/classes.json

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
